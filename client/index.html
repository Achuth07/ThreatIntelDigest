<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WhatCyber ThreatFeed - Stay updated with the latest cybersecurity threats, vulnerabilities, and intelligence from trusted sources.">
    <meta name="keywords" content="cybersecurity, threat intelligence, CVE, vulnerabilities, security news, cyber threats">
    <meta name="author" content="WhatCyber">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph / Facebook.
         These static tags are what link-preview crawlers (LinkedIn, X, Slack) see, because they do
         not run JavaScript, and this one file is served for every page. So they must be generic:
         no og:url or twitter:url here. A fixed URL would make every shared page claim /threatfeed
         as its canonical address; without it the crawlers use the URL that was actually shared.
         The app sets the per-page og:url in the browser. Per-page titles and descriptions for
         these crawlers need server rendering (WHA-17). -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="WhatCyber - ThreatFeed">
    <meta property="og:description" content="Stay updated with the latest cybersecurity threats, vulnerabilities, and intelligence from trusted sources.">
    <meta property="og:image" content="https://www.whatcyber.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="WhatCyber: threat intelligence for security teams">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="WhatCyber - ThreatFeed">
    <meta property="twitter:description" content="Stay updated with the latest cybersecurity threats, vulnerabilities, and intelligence from trusted sources.">
    <meta property="twitter:image" content="https://www.whatcyber.com/og-image.jpg">
    <meta property="twitter:image:alt" content="WhatCyber: threat intelligence for security teams">
    <title>WhatCyber - ThreatFeed</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BX1S1E3N6Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-BX1S1E3N6Q');
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <!-- Load the fonts without blocking first paint; text shows in the fallback font first (display=swap). -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <script>
      // Apply saved theme before first paint to avoid a flash of the wrong mode
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
