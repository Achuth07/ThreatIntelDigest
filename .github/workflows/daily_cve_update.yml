name: Hourly CVE Update

on:
  schedule:
    # Off the hour, when GitHub's scheduler is less congested
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to reach back (blank: continue from the last successful sync)'
        required: false
      history_only:
        description: 'Only load change history, for backfilling timelines'
        type: boolean
        default: false

concurrency:
  group: cve-update
  cancel-in-progress: false

jobs:
  update_cves:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run NVD Update Script
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        DAYS: ${{ github.event.inputs.days }}
        HISTORY_ONLY: ${{ github.event.inputs.history_only }}
      run: |
        args=()
        if [ -n "$DAYS" ]; then args+=(--days "$DAYS"); fi
        if [ "$HISTORY_ONLY" = "true" ]; then args+=(--history-only); fi
        npx tsx scripts/sync_nvd.ts "${args[@]}"

    # WHA-23: announce new CVE tier 2 pages to IndexNow right after they are ingested. Does nothing while
    # tier 2 is off (scripts/set-cve-tier2.ts), and never fails the sync.
    - name: Send new CVE pages to IndexNow
      if: ${{ github.event.inputs.history_only != 'true' }}
      continue-on-error: true
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: npx tsx scripts/submit-cve-indexnow.ts

    # CNA CVSS 4.0/3.x and CISA SSVC from the CVE List (WHA-53). Runs even if the NVD step failed,
    # since the two sources are independent.
    - name: Run CVE List Update Script
      if: ${{ !cancelled() }}
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: npx tsx scripts/sync_cvelist.ts
