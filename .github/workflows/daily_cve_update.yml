name: Daily CVE Update

on:
  schedule:
    # Run daily at 03:00 UTC (after malware load)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to backfill (default: 2; e.g. 300 to backfill gap since Jan 2026)'
        required: false
        default: '2'

jobs:
  update_cves:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run NVD Update Script
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      run: npx tsx scripts/backfill_nvd.ts --days ${{ github.event.inputs.days || '2' }}
