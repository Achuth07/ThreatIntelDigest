name: Weekly Threat Actor Update

on:
  schedule:
    # Run at 04:00 on Sunday
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: threat-actor-update
  cancel-in-progress: false

jobs:
  update-threat-actors:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Groups, ATT&CK IDs, techniques, software and MITRE-cited CVEs (WHA-55)
    - name: Ingest Threat Actors from MITRE
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: npx tsx scripts/ingest-threat-actors.ts

    # Article-actor links, then low-confidence actor-CVE links from news
    - name: Link Threat Actors to Articles
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: npx tsx scripts/link-threat-actors.ts
